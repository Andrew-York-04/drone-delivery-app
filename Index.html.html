function money(n) { return "$" + n.toFixed(2); }

function Stepper({ status }) {
  const idx = STEPS.indexOf(status);
  return (
    <div className="dd-stepper">
      {STEPS.map((s, i) => (
        <div className="dd-step" key={s}>
          {i > 0 && <div className={`dd-step-line ${i <= idx ? "done" : ""}`} />}
          <div className={`dd-step-dot ${i < idx ? "done" : i === idx ? "current" : ""}`}>{i < idx ? <CheckCircle2 size={14} /> : i + 1}</div>
          <div className="dd-step-label">{STEP_LABELS[s]}</div>
        </div>
      ))}
    </div>
  );
}

function RouteVisual({ progress, storeName, address }) {
  const x = 30 + (progress / 100) * 400;
  return (
    <div className="dd-route-wrap">
      <svg viewBox="0 0 460 90" width="100%" height="90">
        <line x1="30" y1="45" x2="430" y2="45" stroke="#E4E8F1" strokeWidth="3" strokeDasharray="6 7" />
        <circle cx="30" cy="45" r="7" fill="#5B5FEF" />
        <circle cx="430" cy="45" r="7" fill="#17B26A" />
        <g transform={`translate(${x},45)`}>
          <circle r="13" fill="white" stroke="#5B5FEF" strokeWidth="2.5" />
          <path d="M-6,-2.5 L6,-2.5 L0,5 Z" fill="#5B5FEF" />
        </g>
      </svg>
      <div className="dd-route-labels"><span>{storeName}</span><span>{address}</span></div>
    </div>
  );
}

function App() {
  const [view, setView] = useState("stores");
  const [categoryFilter, setCategoryFilter] = useState("All");
  const [selectedStore, setSelectedStore] = useState(null);
  const [cart, setCart] = useState({});
  const [deliveryInfo, setDeliveryInfo] = useState({ recipient: "", address: "", window: "", notes: "" });
  const [active, setActive] = useState(null);
  const [log, setLog] = useState([]);
  const [confirmMethod, setConfirmMethod] = useState("photo");
  const intervalRef = useRef(null);

  const categories = ["All", ...Object.keys(CATEGORY_ICON)];
  const visibleStores = categoryFilter === "All" ? STORES : STORES.filter((s) => s.category === categoryFilter);

  const cartItems = useMemo(() => {
    if (!selectedStore) return [];
    return selectedStore.items.filter((i) => cart[i.id] > 0).map((i) => ({ ...i, qty: cart[i.id] }));
  }, [cart, selectedStore]);
  const cartCount = cartItems.reduce((sum, i) => sum + i.qty, 0);
  const cartTotal = cartItems.reduce((sum, i) => sum + i.qty * i.price, 0);

  useEffect(() => {
    if (active && active.status === "in-flight") {
      intervalRef.current = setInterval(() => {
        setActive((prev) => {
          if (!prev) return prev;
          const nextProgress = Math.min(100, prev.progress + 4 + Math.random() * 6);
          const nextBattery = Math.max(18, prev.battery - (0.3 + Math.random() * 0.5));
          const arrived = nextProgress >= 100;
          return {
            ...prev,
            progress: nextProgress,
            battery: Number(nextBattery.toFixed(1)),
            altitude: Math.round(125 + Math.random() * 20),
            speed: Math.round(17 + Math.random() * 7),
            status: arrived ? "arrived" : "in-flight",
            log: arrived ? [...prev.log, { t: now(), msg: "Your drone has landed and is waiting to confirm drop-off" }] : prev.log,
          };
        });
      }, 750);
      return () => clearInterval(intervalRef.current);
    }
  }, [active && active.status]);

  function openStore(store) {
    setSelectedStore(store);
    setCart({});
    setView("menu");
  }
  function updateQty(itemId, delta) {
    setCart((prev) => {
      const next = { ...prev };
      const q = (next[itemId] || 0) + delta;
      if (q <= 0) delete next[itemId];
      else next[itemId] = q;
      return next;
    });
  }
  function removeFromCart(itemId) {
    setCart((prev) => { const next = { ...prev }; delete next[itemId]; return next; });
  }

  function placeOrder(e) {
    e.preventDefault();
    if (!deliveryInfo.recipient || !deliveryInfo.address || cartItems.length === 0) return;
    const id = genId();
    const delivery = {
      id,
      storeName: selectedStore.name,
      items: cartItems,
      total: cartTotal,
      recipient: deliveryInfo.recipient,
      address: deliveryInfo.address,
      window: deliveryInfo.window || "As soon as possible",
      notes: deliveryInfo.notes,
      status: "dispatched",
      progress: 0,
      battery: 96,
      altitude: 130,
      speed: 20,
      requestedAt: now(),
      log: [{ t: now(), msg: `Order ${id} placed at ${selectedStore.name}` }],
    };
    setActive(delivery);
    setView("tracking");
    setTimeout(() => {
      setActive((prev) => (prev ? { ...prev, status: "in-flight", log: [...prev.log, { t: now(), msg: "Drone is in the air, heading your way" }] } : prev));
    }, 900);
  }

  function handleConfirmDelivery() {
    if (!active) return;
    const methodLabel = { photo: "Photo capture", qr: "QR code scan", pin: "PIN entry", signature: "Digital signature" }[confirmMethod];
    const code = confirmMethod === "photo" ? "IMG-" + genCode(4) : confirmMethod === "signature" ? "SIG-" + genCode(4) : genCode(confirmMethod === "pin" ? 4 : 6);
    const completed = { ...active, status: "delivered", deliveredAt: now(), confirmMethod: methodLabel, confirmCode: code, log: [...active.log, { t: now(), msg: `Delivery confirmed via ${methodLabel} (${code})` }] };
    setLog((prev) => [completed, ...prev]);
    setActive(null);
    setSelectedStore(null);
    setCart({});
    setDeliveryInfo({ recipient: "", address: "", window: "", notes: "" });
    setView("history");
  }

  const statusPill = (status) => {
    if (status === "delivered") return <span className="dd-pill green"><CheckCircle2 size={13} /> Delivered</span>;
    if (status === "arrived") return <span className="dd-pill amber"><MapPin size={13} /> Waiting to confirm</span>;
    if (status === "in-flight") return <span className="dd-pill blue"><Navigation2 size={13} /> On the way</span>;
    if (status === "dispatched") return <span className="dd-pill blue"><Radio size={13} /> Dispatched</span>;
    return <span className="dd-pill grey">Idle</span>;
  };

  return (
    <div className="dd-app">
      <style>{STYLE}</style>

      <div className="dd-topbar">
        <div className="dd-brand">
          <div className="dd-brand-mark"><Package size={19} /></div>
          <div><div className="dd-brand-text">NoPrior<span style={{ color: "var(--primary)" }}>IT</span>ies</div><div className="dd-brand-sub">Every order flies in the order it lands — no priority lanes, no rush fees</div></div>
        </div>
        <div className="dd-tabs">
          <button className={`dd-tab ${["stores", "menu", "cart"].includes(view) ? "active" : ""}`} onClick={() => setView("stores")}><ShoppingBasket size={15} /> Order</button>
          <button className={`dd-tab ${view === "tracking" ? "active" : ""}`} onClick={() => setView("tracking")} disabled={!active}><Navigation2 size={15} /> Track</button>
          <button className={`dd-tab ${view === "history" ? "active" : ""}`} onClick={() => setView("history")}><History size={15} /> Past orders</button>
        </div>
        {view === "menu" && cartCount > 0 ? (
          <button className="dd-cart-btn" onClick={() => setView("cart")}>
            <ShoppingCart size={16} /> Cart <span className="dd-cart-badge">{cartCount}</span>
          </button>
        ) : <div style={{ width: 90 }} />}
      </div>

      <div className="dd-main">
        {view === "stores" && (
          <>
            <div className="dd-page-title">Where should we order from?</div>
            <div className="dd-page-sub">Pick a store, add what you need, and a drone will bring it straight to your door — first come, first flown, every time.</div>
            <div className="dd-chip-row">
              {categories.map((c) => (
                <button key={c} className={`dd-chip ${categoryFilter === c ? "active" : ""}`} onClick={() => setCategoryFilter(c)}>{c}</button>
              ))}
            </div>
            <div className="dd-store-grid">
              {visibleStores.map((store) => {
                const Icon = CATEGORY_ICON[store.category];
                const colors = CATEGORY_COLOR[store.category];
                return (
                  <div className="dd-store-card" key={store.id} onClick={() => openStore(store)}>
                    <div className="dd-store-icon" style={{ background: colors.bg }}><Icon size={22} color={colors.fg} /></div>
                    <div>
                      <div className="dd-store-name">{store.name}</div>
                      <div className="dd-store-meta" style={{ marginTop: 2 }}>{store.category}</div>
                    </div>
                    <div className="dd-store-meta">
                      <span><Clock size={13} /> ~{store.eta} min</span>
                      <span><Star size={13} fill="#F79009" color="#F79009" /> {store.rating}</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </>
        )}

        {view === "menu" && selectedStore && (
          <>
            <div className="dd-back-row">
              <button className="dd-back-btn" onClick={() => setView("stores")}><ChevronLeft size={16} /> All stores</button>
            </div>
            <div className="dd-page-title">{selectedStore.name}</div>
            <div className="dd-page-sub">~{selectedStore.eta} minute flight · {selectedStore.category}</div>
            <div className="dd-item-list">
              {selectedStore.items.map((item) => {
                const qty = cart[item.id] || 0;
                return (
                  <div className="dd-item-row" key={item.id}>
                    <div className="dd-item-thumb" style={{ background: CATEGORY_COLOR[selectedStore.category].bg }}>
                      <Package size={18} color={CATEGORY_COLOR[selectedStore.category].fg} />
                    </div>
                    <div>
                      <div className="dd-item-name">{item.name}</div>
                      {item.desc && <div className="dd-item-desc">{item.desc}</div>}
                    </div>
                    <div className="dd-item-price">{item.price > 0 ? money(item.price) : "—"}</div>
                    {qty === 0 ? (
                      <button className="dd-add-btn" onClick={() => updateQty(item.id, 1)}>Add</button>
                    ) : (
                      <div className="dd-qty-stepper">
                        <button className="dd-qty-btn" onClick={() => updateQty(item.id, -1)}><Minus size={14} /></button>
                        <span style={{ fontWeight: 700, minWidth: 14, textAlign: "center" }}>{qty}</span>
                        <button className="dd-qty-btn" onClick={() => updateQty(item.id, 1)}><Plus size={14} /></button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
            {cartCount > 0 && (
              <div className="dd-floating-cart" onClick={() => setView("cart")}>
                <span>{cartCount} item{cartCount > 1 ? "s" : ""}</span>
                <span>{money(cartTotal)}</span>
                <span>View cart →</span>
              </div>
            )}
          </>
        )}

        {view === "cart" && selectedStore && (
          <>
            <div className="dd-back-row">
              <button className="dd-back-btn" onClick={() => setView("menu")}><ChevronLeft size={16} /> Back to {selectedStore.name}</button>
            </div>
            <div className="dd-page-title">Checkout</div>
            <div className="dd-page-sub">Confirm your order and tell us where to drop it off.</div>
            {cartItems.length === 0 ? (
              <div className="dd-empty">Your cart is empty. Go back and add a few things.</div>
            ) : (
              <div className="dd-grid">
                <form className="dd-card" onSubmit={placeOrder}>
                  <div className="dd-card-label">DELIVERY DETAILS</div>
                  <div className="dd-field"><label>Your name</label><input value={deliveryInfo.recipient} onChange={(e) => setDeliveryInfo({ ...deliveryInfo, recipient: e.target.value })} placeholder="e.g. Maria Chen" /></div>
                  <div className="dd-field"><label>Delivery address</label><input value={deliveryInfo.address} onChange={(e) => setDeliveryInfo({ ...deliveryInfo, address: e.target.value })} placeholder="Street address, unit, city" /></div>
                  <div className="dd-field"><label>When would you like it? (optional)</label><input value={deliveryInfo.window} onChange={(e) => setDeliveryInfo({ ...deliveryInfo, window: e.target.value })} placeholder="e.g. As soon as possible" /></div>
                  <div className="dd-field"><label>Anything the drone should know? (optional)</label><textarea rows={2} value={deliveryInfo.notes} onChange={(e) => setDeliveryInfo({ ...deliveryInfo, notes: e.target.value })} placeholder="e.g. Please drop in the backyard, not the front porch" /></div>
                  <button className="dd-btn" type="submit"><Send size={16} /> Place order — {money(cartTotal)}</button>
                </form>
                <div className="dd-card">
                  <div className="dd-card-label">YOUR ORDER</div>
                  {cartItems.map((item) => (
                    <div className="dd-cart-line" key={item.id}>
                      <span className="dd-cart-line-name">{item.qty} × {item.name}</span>
                      <span className="dd-cart-line-price">{money(item.qty * item.price)}</span>
                      <button className="dd-remove-btn" onClick={() => removeFromCart(item.id)}><Trash2 size={15} /></button>
                    </div>
                  ))}
                  <div className="dd-subtotal-row"><span>Total</span><span>{money(cartTotal)}</span></div>
                  <div className="dd-divider" />
                  <div style={{ fontSize: 12.5, color: "var(--text-secondary)", display: "flex", gap: 8, alignItems: "center", marginBottom: 10 }}>
                    <ShieldCheck size={15} color="#17B26A" /> Flight path checked automatically — no extra steps for you.
                  </div>
                  <div style={{ fontSize: 12.5, color: "var(--text-secondary)", display: "flex", gap: 8, alignItems: "center" }}>
                    <Clock size={15} color="#5B5FEF" /> Fair-flight queue: there's no paid skip-the-line option here — your order launches in the order it was placed.
                  </div>
                </div>
              </div>
            )}
          </>
        )}

        {view === "tracking" && (
          <>
            {!active ? (
              <div className="dd-empty">Nothing in the air right now. Place an order to see it here.</div>
            ) : (
              <>
                <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 10 }}>
                  <div>
                    <div className="dd-page-title" style={{ marginBottom: 0 }}>{active.storeName}</div>
                    <div className="dd-page-sub" style={{ marginBottom: 4 }}>Order {active.id} → {active.address}</div>
                  </div>
                  {statusPill(active.status)}
                </div>

                <Stepper status={active.status} />

                <div className="dd-grid" style={{ marginTop: 22 }}>
                  <div className="dd-card">
                    <div className="dd-card-label">FLIGHT PROGRESS</div>
                    <RouteVisual progress={active.progress} storeName={active.storeName} address={active.address.split(",")[0]} />
                    <div className="dd-telemetry-grid">
                      <div className="dd-telemetry-item"><div className="dd-telemetry-icon"><Battery size={18} color={active.battery < 30 ? "#F04438" : "#17B26A"} /></div><div><div className="dd-telemetry-value">{active.battery}%</div><div className="dd-telemetry-key">Drone battery</div></div></div>
                      <div className="dd-telemetry-item"><div className="dd-telemetry-icon"><Navigation2 size={18} color="#5B5FEF" /></div><div><div className="dd-telemetry-value">{active.altitude} ft</div><div className="dd-telemetry-key">Altitude</div></div></div>
                      <div className="dd-telemetry-item"><div className="dd-telemetry-icon"><Wind size={18} color="#707A8A" /></div><div><div className="dd-telemetry-value">{active.speed} mph</div><div className="dd-telemetry-key">Speed</div></div></div>
                      <div className="dd-telemetry-item"><div className="dd-telemetry-icon"><Clock size={18} color="#707A8A" /></div><div><div className="dd-telemetry-value">{active.status === "arrived" || active.status === "delivered" ? "Arrived" : Math.max(1, Math.round((100 - active.progress) / 8)) + " min"}</div><div className="dd-telemetry-key">Time left</div></div></div>
                    </div>
                    {active.battery < 30 && <div className="dd-alert"><AlertTriangle size={15} style={{ marginTop: 1 }} /><span>Running low on battery — the drone will head straight back to base right after drop-off.</span></div>}
                  </div>

                  <div className="dd-card">
                    <div className="dd-card-label">{active.status === "arrived" ? "CONFIRM YOU GOT IT" : "WHAT'S HAPPENING"}</div>
                    {active.status === "arrived" ? (
                      <>
                        <p style={{ fontSize: 13.5, color: "var(--text-secondary)", marginTop: 0 }}>Your drone has landed. How would you like to confirm you received your order?</p>
                        <div className="dd-confirm-options">
                          <div className={`dd-confirm-option ${confirmMethod === "photo" ? "selected" : ""}`} onClick={() => setConfirmMethod("photo")}><Camera size={18} /> Take a photo</div>
                          <div className={`dd-confirm-option ${confirmMethod === "qr" ? "selected" : ""}`} onClick={() => setConfirmMethod("qr")}><QrCode size={18} /> Scan QR code</div>
                          <div className={`dd-confirm-option ${confirmMethod === "pin" ? "selected" : ""}`} onClick={() => setConfirmMethod("pin")}><KeyRound size={18} /> Enter PIN</div>
                          <div className={`dd-confirm-option ${confirmMethod === "signature" ? "selected" : ""}`} onClick={() => setConfirmMethod("signature")}><PenLine size={18} /> Sign</div>
                        </div>
                        <button className="dd-btn" onClick={handleConfirmDelivery}><CheckCircle2 size={16} /> I got my order</button>
                      </>
                    ) : (
                      <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                        {active.log.map((l, i) => (<div key={i} style={{ fontSize: 13 }}><span style={{ color: "var(--text-secondary)" }}>{l.t}</span> — {l.msg}</div>))}
                      </div>
                    )}
                    <div className="dd-divider" />
                    <div className="dd-card-label">WHAT YOU ORDERED</div>
                    <div style={{ fontSize: 13, color: "var(--text-secondary)", lineHeight: 1.7 }}>
                      {active.items.map((i) => (<div key={i.id}>{i.qty} × {i.name}</div>))}
                    </div>
                  </div>
                </div>
              </>
            )}
          </>
        )}

        {view === "history" && (
          <>
            <div className="dd-page-title">Past orders</div>
            <div className="dd-page-sub">Everything you've ordered, with proof it arrived.</div>
            <div className="dd-card">
              {log.length === 0 ? (
                <div className="dd-empty">No completed orders yet — your first one will show up here.</div>
              ) : (
                <table className="dd-log-table">
                  <thead><tr><th>Order</th><th>Store</th><th>Items</th><th>Delivered</th><th>Confirmed with</th></tr></thead>
                  <tbody>
                    {log.map((d) => (
                      <tr key={d.id}>
                        <td>{d.id}</td>
                        <td>{d.storeName}</td>
                        <td>{d.items.length} item{d.items.length > 1 ? "s" : ""}</td>
                        <td>{d.deliveredAt}</td>
                        <td>{d.confirmMethod} ({d.confirmCode})</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>
          </>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
